[project]
name = "lark-cli-mcp"
version = "0.1.0"
description = "Expose the official Feishu/Lark CLI (larksuite/cli) as a hardened MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
lark-cli-mcp = "lark_cli_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lark_cli_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
